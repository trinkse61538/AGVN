name: Apply AGVN performance v3.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-homepage-v33:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run performance v3.3
        run: node scripts/apply-performance-v33.js

      - name: Commit optimized homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/apply-performance-v33.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "perf: apply AGVN homepage performance v3.3"
            git push
          fi
