name: Apply AGVN performance patch v3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-homepage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply performance patch v3
        run: node scripts/apply-performance-v3.js

      - name: Commit optimized homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/apply-performance-v3.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "perf: lite-load YouTube and remove heavy homepage libraries"
            git push
          fi
