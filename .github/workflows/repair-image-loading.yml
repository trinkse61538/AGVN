name: Repair AGVN image loading

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair banner and product images
        run: node scripts/repair-image-loading.js

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html product_template.html san-pham assets/performance
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: restore banner and product image loading"
            git push
          fi
