name: Apply AGVN frontend image and AOS fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch AOS and image loading
        run: node scripts/apply-agvn-frontend-fix.js

      - name: Regenerate product and news pages
        run: |
          node generate.js || echo "Generate encountered a temporary Sheet/image error. Templates are already fixed; the hourly sync can retry later."

      - name: Commit fixed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "fix: stabilize desktop content and image loading"
          git push
