name: Đồng bộ sản phẩm & tin tức từ Google Sheet + Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Quyền deploy lên GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Chỉ cho phép 1 deployment chạy 1 lúc
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Generate All Pages
        run: node generate.js

      - name: Commit và Push
        run: |
          git config --global user.name "AGVN Automation Bot"
          git config --global user.email "bot@agvngroup.com"

          git add -f san-pham/*.html 2>/dev/null || true
          git add -f tin-tuc/*.html 2>/dev/null || true
          git add -f tintuc.html 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✅ Không có thay đổi mới từ Google Sheet"
          else
            git commit -m "Tự động đồng bộ sản phẩm & tin tức từ Google Sheet"
            git push origin HEAD:main
            echo "✅ Đã push thay đổi lên GitHub"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
